version: 2
updates:
  - package-ecosystem: npm
    target-branch: "staging"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-deps:
        dependency-type: development
      production:
        dependency-type: production
  - package-ecosystem: github-actions
    target-branch: "staging"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: weekly
